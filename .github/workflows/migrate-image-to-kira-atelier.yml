name: One-time migration from IMAGE to KIRA Atelier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-image-to-kira-atelier.yml'
  workflow_dispatch:
    inputs:
      include_original_images:
        description: "Copy the 759 original PNG files into KIRA Atelier (about 706 MiB)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: kira-atelier-one-time-image-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout KIRA Atelier
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout the legacy IMAGE source
        env:
          SOURCE_URL: https://github.com/rikosama473-sketch/image.git
        run: git clone --depth 1 "$SOURCE_URL" "$RUNNER_TEMP/image-source"

      - name: Synchronize project tools, records, generated outputs and originals
        env:
          INCLUDE_ORIGINAL_IMAGES: "true"
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/image-source"
          DST="$GITHUB_WORKSPACE"

          # Merge current tracked project directories without deleting KIRA Atlas material.
          for dir in assets data docs generated ml scripts tests tools; do
            if [[ -d "$SRC/$dir" ]]; then
              mkdir -p "$DST/$dir"
              cp -a "$SRC/$dir/." "$DST/$dir/"
            fi
          done

          # Existing KIRA workflows stay untouched here; legacy workflow files are migrated separately with authorized repository writes.

          # Preserve every dependency manifest from the legacy project, including optional modules.
          find "$SRC" -maxdepth 1 -type f -name 'requirements*.txt' -print0 |
            while IFS= read -r -d '' file; do cp -f "$file" "$DST/"; done

          # Keep the previous design notes as historical reference, not over the KIRA-specific atlas docs.
          if [[ -f "$SRC/trabajo aparte/diseño.md" ]]; then
            mkdir -p "$DST/docs/legacy"
            cp -f "$SRC/trabajo aparte/diseño.md" "$DST/docs/legacy/IMAGE-design.md"
          fi

          if [[ "$INCLUDE_ORIGINAL_IMAGES" == "true" ]]; then
            find "$SRC" -maxdepth 1 -type f -iname '*.png' -print0 |
              while IFS= read -r -d '' file; do cp -f "$file" "$DST/"; done
            actual_count=$(find "$DST" -maxdepth 1 -type f -iname '*.png' | wc -l)
            if [[ "$actual_count" -lt 759 ]]; then
              echo "Expected at least 759 original root PNGs, found $actual_count" >&2
              exit 1
            fi
          fi

          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          lines = readme.read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              if line.startswith("- El código, las interfaces, los catálogos, las auditorías"):
                  lines[i] = (
                      "- La migración se amplió para sincronizar los módulos, herramientas, pruebas, "
                      "registros, manifiestos y salidas visuales actuales desde el repositorio anterior."
                  )
              elif line.startswith("- Los PNG originales de la colección principal"):
                  lines[i] = (
                      "- Los 759 PNG originales de la colección principal se copiaron a la raíz de "
                      "KIRA Atelier para conservar las rutas históricas del dataset. El repositorio "
                      "image original permanece intacto como respaldo temporal."
                  )
          lines.append("")
          lines.append("## Migración ampliada — 23 de octubre de 2026")
          lines.append("")
          lines.append(
              "La rama main se sincronizó desde el repositorio rikosama473-sketch/image: se copiaron las "
              "herramientas, scripts, pruebas, catálogos, metadatos de generación, requisitos opcionales, "
              "salidas actuales y la colección original de 759 PNG. También se conservó el documento "
              "de diseño previo bajo docs/legacy/IMAGE-design.md. El repositorio anterior no se borró ni reescribió."
          )
          lines.append(
              "La migración de archivos no valida permisos de terceros ni certifica máscaras o recortes "
              "como capas de producción. Las referencias cuya licencia o precio sigue sin confirmarse "
              "continúan pendientes de revisión; la transferencia no cambia sus derechos."
          )
          readme.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")

          migration = Path("docs/KIRA_ATELIER_MIGRATION.md")
          if migration.exists():
              doc = migration.read_text(encoding="utf-8")
              start = "## Pendiente de una migración completa de los archivos gráficos"
              end = "## Rebranding y conservación"
              if start in doc and end in doc and doc.index(start) < doc.index(end):
                  a = doc.index(start)
                  b = doc.index(end)
                  doc = doc[:a] + (
                      "## Estado inicial de la migración (actualizado abajo)\n\n"
                      "Esta sección registraba el corte inicial, cuando los PNG originales seguían en "
                      "el repositorio anterior. La sincronización ampliada descrita al final reemplaza "
                      "ese estado.\n\n"
                  ) + doc[b:]
              doc += (
                  "\n\n## Migración ampliada — 23 de octubre de 2026\n\n"
                  "Se sincronizaron los módulos, scripts, pruebas, catálogos, manifiestos y archivos "
                  "generados desde la rama main del repositorio image. Se copiaron además los 759 PNG "
                  "originales de la raíz, manteniendo sus nombres y rutas para no romper las referencias "
                  "del dataset. image se conserva intacto como respaldo hasta terminar las verificaciones "
                  "de integración. La copia no equivale a una aprobación de licencias ni convierte máscaras "
                  "candidatas en capas aprobadas.\n"
              )
              migration.write_text(doc, encoding="utf-8")
          PY

      - name: Validate copied files
        run: |
          set -euo pipefail
          python -m compileall -q ml scripts tools
          python - <<'PY'
          from pathlib import Path
          import json

          json_files = list(Path("data").rglob("*.json"))
          json_files += list(Path("tools").rglob("*.json"))
          json_files += list(Path("generated").rglob("*.json"))
          json_files += list(Path("trabajo aparte").rglob("*.json"))
          for path in json_files:
              with path.open(encoding="utf-8") as f:
                  json.load(f)
          pngs = list(Path(".").glob("*.png"))
          print(f"Validated JSON files: {len(json_files)}")
          print(f"Root PNG originals present: {len(pngs)}")
          assert len(pngs) >= 759, f"Expected 759 root PNG files, found {len(pngs)}"
          assert Path("tools/avatar-maker/index.html").is_file()
          assert Path("tools/manual-character-editor/index.html").is_file()
          assert Path("tools/hairstyle-workbench/index.html").is_file()
          assert Path("tools/visual-reference-library/index.html").is_file()
          assert Path("trabajo aparte/indice-visual-componentes.json").is_file()
          PY

      - name: Commit migration on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Some repository ignore rules intentionally omit generated/original graphics.
          git add -f -- *.png generated/
          git status --short
          git commit -m "Migrate IMAGE assets and tools into KIRA Atelier"
          git push origin HEAD:main
